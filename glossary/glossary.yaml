# CUSTOMER GLOSSARY: the place for customer-provided definitions. Not generated from the dbt project or the data.
# Today it holds the author's assumed defaults only (see the note below): no entry has been confirmed by a customer.
# Edit this file, then run `make glossary-check` (it checks tables, columns and SQL against the warehouse).
#
# kind:   definition        what a business word means
#         rule              which rows count, which do not, how to behave
#         reference         a fact the data cannot hold (always sent with the question)
# status: confirmed = the customer signed it off; assumed = default we use until the customer confirms.
#
# Concepts only: no dates, no figures, no examples taken from the data. Facts about the data come from the generated context.
# What the warehouse does not have (refunds, targets, costs, order times) is NOT listed here: the agent must find that out itself.
# PROOF OF CONCEPT: the whole file is sent with every question, which does not scale (it needs embedding retrieval). The entries are assumptions;
# a company must decide its own truths before the answers can be trusted.
# EVERY ENTRY BELOW IS ASSUMED: these are the defaults supplied by the author until the customer confirms them.
# "Maya" is a placeholder name for the customer's data owner, not a real person.
entries:
  - id: revenue
    kind: definition
    terms: [revenue, sales, turnover, pre-tax revenue]
    applies_to: [orders.subtotal]
    text: Revenue is pre-tax sales, the sum of orders.subtotal. State this definition in every answer that gives a revenue figure.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: revenue_incl_tax
    kind: definition
    terms: [revenue including tax, revenue with sales tax, tax-inclusive revenue, order total]
    applies_to: [orders.order_total]
    text: Revenue including sales tax is the sum of orders.order_total. Use it only when asked for explicitly.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: new_customer
    kind: definition
    terms: [new customer, new customers, customer acquisition, acquired customers, first-time buyers]
    applies_to: [customers.first_ordered_at]
    text: A customer is new in a period if their first-ever order falls in that period. Do not use customers.customer_type = 'new' for this.
    sql: first_ordered_at >= :start and first_ordered_at < :end
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: fiscal_year
    kind: reference
    terms: [fiscal year, financial year, fiscal quarter, year to date]
    applies_to: [orders.ordered_at]
    text: The fiscal year is the calendar year.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: empty_orders
    kind: rule
    terms: [orders, order count, average order, first order, second order, order sequence, days between orders, empty orders, zero-dollar orders]
    applies_to: [orders.order_total]
    text: Orders with a $0 total and no items are excluded from counts, averages and order sequence (first order, second order, and so on). customer_order_number counts them, so rank the orders yourself.
    sql: order_total > 0
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: store_start_date
    kind: rule
    terms: [store opened, opening date, when did the store start, new store, store launch]
    applies_to: [locations.opened_date, orders.ordered_at]
    text: For when a store started trading, trust the store's first order in orders over locations.opened_date, and flag any gap between the two.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: customer_identity
    kind: rule
    terms: [customers, how many customers, distinct customers, customer count, unique customers]
    applies_to: [orders.customer_id]
    text: Count customers by customer_id, not by name.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: relative_dates
    kind: reference
    terms: [today, now, last month, this month, this quarter, last quarter, recent, recently]
    applies_to: [orders.ordered_at]
    text: The last date in the data is not today. For relative periods such as "last month" or "this quarter", ask which period is meant and state the last date in the data.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: partial_periods
    kind: rule
    terms: [quarter, compared with, change versus, period over period, quarter over quarter, month over month, growth]
    applies_to: [orders.ordered_at]
    text: If the data covers only part of a period, say so and ask before comparing it with a full period.
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04

  - id: gross_profit
    kind: definition
    terms: [gross profit, gross margin, cost of goods sold, COGS, margin on menu items]
    applies_to: [orders.order_cost]
    text: Gross profit is pre-tax revenue minus supply costs (orders.order_cost).
    status: assumed
    owner: Maya (defaults until confirmed)
    date: 2026-11-04
